<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Clickbait target icon</title>
  <desc id="desc">A lime splatter target and crosshair on black range paper</desc>
