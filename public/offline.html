<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F4F4EC" />
    <title>Offline · Clickbait</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #161914;
        background-color: #f4f4ec;
        background-image:
          linear-gradient(#c9d2c4 1px, transparent 1px),
          linear-gradient(90deg, #c9d2c4 1px, transparent 1px);
        background-size: 24px 24px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      main {
        width: min(100%, 520px);
        padding: 28px;
        border: 3px solid #161914;
        border-radius: 4px;
        background: #fbfbf5;
        box-shadow: 5px 5px 0 #c9d2c4;
      }
      h1 { margin: 0 0 12px; font-family: "Arial Narrow", sans-serif; }
      p { line-height: 1.6; }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        margin-top: 8px;
        padding: 8px 14px;
        border: 2px solid #161914;
        border-radius: 3px;
        color: #161914;
        background: #c8f51f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OFFLINE</h1>
      <p>
        Clickbait could not load the saved app shell on this device. Reconnect
        once, open the app, and it will prepare the current version for offline
        range use.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
